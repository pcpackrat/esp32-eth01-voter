; ESP32-ETH01-Voter - full duplex voter client
; Hardware: WT32-ETH01 (ESP32 + LAN8720) + ES8311 codec + GPS w/ PPS

[env:wt32-eth01]
platform = espressif32
board = wt32-eth01
framework = arduino
monitor_speed = 115200
extra_scripts = pre:build_timestamp.py

lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3
    ; WireGuard: lib/esp_wireguard (droscy/esp_wireguard 0.4.2, patched -
    ; see the note at the top of lib/esp_wireguard/src/wireguardif.c)
    esphome/libsodium @ ^1.10018.1

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D WG_BIND_DEFAULT_NETIF
    ; allowed IPs per peer: own /32 + tunnel subnet + up to 4 remote subnets
    ; (library default is 1 - replies to anything but our own IP were dropped)
    -D CONFIG_WIREGUARD_MAX_SRC_IPS=8
    ; WireGuard remote subnets: lwIP route lookup goes through WgTunnel.cpp
    -Wl,--wrap=ip4_route_src
